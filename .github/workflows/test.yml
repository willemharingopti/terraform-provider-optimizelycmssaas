name: Test

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: these jobs only read the repository.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      # Unit tests only. The acceptance tests (TestAcc*) create objects on a real CMS and are skipped
      # without TF_ACC; the live read-only test is skipped without credentials. No secrets are used here.
      - name: Unit tests
        run: go test ./... -count=1

  docs-up-to-date:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: Regenerate docs
        run: go generate ./...
      - name: Fail if the generated docs are out of date
        run: |
          if [ -n "$(git status --porcelain docs)" ]; then
            echo "docs/ is out of date. Run 'go generate ./...' and commit the result."
            git status --porcelain docs
            git diff docs | head -80
            exit 1
          fi
